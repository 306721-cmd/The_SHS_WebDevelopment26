<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Conditional Statements Assignment</title>

    <script>

        function isNegative() {

            let num = document.getElementById("num").value;

            // using !== (not equal strict comparison example)
            if (num !== "") {

                if (num < 0) {
                    alert("negative");
                }
            }
        }

        function isNegOrNon() {

            let num = document.getElementById("num").value;

            // using === and < operator
            if (num < 0) {
                alert("negative");
            }
            else if (num === "0" || num > 0) {
                // using || (OR)
                alert("nonnegative");
            }
        }

        function isNegOrNonOrNaN() {

            let num = document.getElementById("num").value;

            // using isNaN + logical operators
            if (isNaN(num)) {
                alert("Not a Number");
            }
            else if (num < 0 && num !== "") {
                // using && (AND)
                alert("negative");
            }
            else {
                alert("nonnegative");
            }
        }

    </script>

</head>

<body>

    <main>

        <h2>Conditional Statement Exercises</h2>

        Number:
        <input id="num" type="text"/>

        <br><br>

        <input type="button" value="Exercise One" onclick="isNegative()" />
        <input type="button" value="Exercise Two" onclick="isNegOrNon()" />
        <input type="button" value="Exercise Three" onclick="isNegOrNonOrNaN()" />

        <div id="outError"></div>

    </main>

</body>

</html>

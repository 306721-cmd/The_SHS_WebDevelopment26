<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App - User #42</title>

    <link rel="stylesheet" href="font/Rimouski.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="app-title">
            <p>Weather App - User #42</p>
        </div>

        <div class="search-box" style="padding: 15px; text-align: center; background-color: #F4F9FF;">
            <input type="text" id="city-input" placeholder="Enter city name..." style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 65%;">
            <button id="search-btn" style="padding: 8px 12px; background-color: #293251; color: white; border: none; border-radius: 4px; cursor: pointer;">Search</button>
        </div>

        <div class="notification"></div>

        <div class="weather-container">

            <div class="weather-icon">
                <img src="icons/unknown.png" alt="Weather Icon" id="icon-img">
            </div>

            <div class="temperature-value">
                <p id="temp-text">-<span>°C</span></p>
            </div>

            <div class="temperature-description">
                <p id="desc-text">-</p>
            </div>

            <div class="location">
                <p id="location-text">-</p>
            </div>

            <div class="extra-info">
                <p class="humidity">Humidity: <span id="humidity-text">-</span></p>
                <p class="wind">Wind: <span id="wind-text">-</span></p>
            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>

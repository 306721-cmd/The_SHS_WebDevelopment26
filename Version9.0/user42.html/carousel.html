<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Sawyer's Watchlist - Gallery</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="CSS/style.css">

    <!-- JS dependencies (ORDER MATTERS) -->
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-md navbar-dark bg-dark">

    <a class="navbar-brand" href="index.html">Sawyer's Watchlist</a>

    <!-- FIX: mobile toggle -->
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#nav">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">

        <div class="navbar-nav">

            <a href="index.html" class="nav-item nav-link">Home</a>
            <a href="godfather.html" class="nav-item nav-link">The Godfather</a>
            <a href="interstellar.html" class="nav-item nav-link">Interstellar</a>
            <a href="topgun.html" class="nav-item nav-link">Top Gun</a>
            <a href="ferris.html" class="nav-item nav-link">Ferris Bueller</a>

            <a href="gallery.html" class="nav-item nav-link active">Gallery</a>

        </div>
    </div>

</nav>

<!-- CAROUSEL -->
<div class="container mt-4">

    <div id="movieCarousel" class="carousel slide" data-ride="carousel">

        <!-- INDICATORS -->
        <ol class="carousel-indicators">
            <li data-target="#movieCarousel" data-slide-to="0" class="active"></li>
            <li data-target="#movieCarousel" data-slide-to="1"></li>
            <li data-target="#movieCarousel" data-slide-to="2"></li>
            <li data-target="#movieCarousel" data-slide-to="3"></li>
        </ol>

        <!-- SLIDES -->
        <div class="carousel-inner">

            <div class="carousel-item active">
                <img class="d-block w-100" src="images/godfather.jpg" alt="Godfather">
                <div class="carousel-caption">
                    <h3>The Godfather</h3>
                </div>
            </div>

            <div class="carousel-item">
                <img class="d-block w-100" src="images/interstellar.jpg" alt="Interstellar">
                <div class="carousel-caption">
                    <h3>Interstellar</h3>
                </div>
            </div>

            <div class="carousel-item">
                <img class="d-block w-100" src="images/topgun.jpg" alt="Top Gun">
                <div class="carousel-caption">
                    <h3>Top Gun: Maverick</h3>
                </div>
            </div>

            <div class="carousel-item">
                <img class="d-block w-100" src="images/ferris.jpg" alt="Ferris Bueller">
                <div class="carousel-caption">
                    <h3>Ferris Bueller's Day Off</h3>
                </div>
            </div>

        </div>

        <!-- CONTROLS -->
        <a class="carousel-control-prev" href="#movieCarousel" role="button" data-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </a>

        <a class="carousel-control-next" href="#movieCarousel" role="button" data-slide="next">
            <span class="carousel-control-next-icon"></span>
        </a>

    </div>

</div>

</body>
</html>
